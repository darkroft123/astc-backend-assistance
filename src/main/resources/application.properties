# =============================================================================
# SMMS Assistance Service - Configuration
# =============================================================================

quarkus.application.name=smms-assistance-service
quarkus.http.port=8082

# =============================================================================
# DATABASE
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:assistance_user}
quarkus.datasource.password=${DB_PASSWORD:assistance_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:astc_assistance}

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# =============================================================================
# FLYWAY
# =============================================================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# =============================================================================
# JWT (RS256)
# =============================================================================
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=better-auth-verify
quarkus.smallrye-jwt.roles-claim-path=groups

# =============================================================================
# SECURITY RULES
# =============================================================================
quarkus.http.auth.permission.authenticated.paths=/rest/secure/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.http.auth.permission.public.paths=/graphql,/q/*
quarkus.http.auth.permission.public.policy=permit

# =============================================================================
# GRAPHQL
# =============================================================================
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.root-path=/graphql
quarkus.smallrye-graphql.federation.enabled=true

# =============================================================================
# S3 / MINIO
# =============================================================================
app.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.access-key=${S3_ACCESS_KEY:minioadmin}
app.storage.secret-key=${S3_SECRET_KEY:minioadmin}
app.storage.region=${S3_REGION:us-east-1}
app.storage.bucket=${S3_BUCKET:assistance}

# =============================================================================
# REDIS
# =============================================================================
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# =============================================================================
# RABBITMQ
# =============================================================================
quarkus.rabbitmq.devservices.enabled=false

mp.messaging.outgoing.assistance-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.assistance-events.exchange.name=assistance.events
mp.messaging.outgoing.assistance-events.exchange.type=topic

rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USER:guest}
rabbitmq-password=${RABBITMQ_PASS:guest}

# =============================================================================
# OPENTELEMETRY
# =============================================================================
quarkus.otel.enabled=${OTEL_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=smms-assistance-service

# =============================================================================
# LOGGING
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# CORS
# =============================================================================
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.access-control-allow-credentials=true

%prod.quarkus.http.cors=true
%prod.quarkus.http.cors.origins=http://localhost:3000
%prod.quarkus.http.cors.methods=GET,POST,OPTIONS
%prod.quarkus.http.cors.headers=Content-Type,Authorization
%prod.quarkus.http.cors.access-control-allow-credentials=true