# =============================================================================
# SMMS Assistance Service - Configuration
# =============================================================================

quarkus.application.name=smms-assistance-service
quarkus.http.port=8082

# =============================================================================
# Database
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:assistance_user}
quarkus.datasource.password=${DB_PASSWORD:assistance_pass}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:assistance_db}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# =============================================================================
# Flyway
# =============================================================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# =============================================================================
# JWT Security
# =============================================================================
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://smms.auth.example.com}
quarkus.smallrye-jwt.enabled=true

# =============================================================================
# GraphQL
# =============================================================================
quarkus.smallrye-graphql.ui.enable=true
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.schema-include-directives=true
quarkus.smallrye-graphql.schema-include-schema-definition=true
smallrye.graphql.federation.enabled=true

# =============================================================================
# S3 / MinIO
# =============================================================================
app.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.access-key=${S3_ACCESS_KEY:minioadmin}
app.storage.secret-key=${S3_SECRET_KEY:minioadmin}
app.storage.region=${S3_REGION:us-east-1}
app.storage.bucket=${S3_BUCKET:assistance}

# =============================================================================
# Redis
# =============================================================================
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# =============================================================================
# RabbitMQ
# =============================================================================
quarkus.rabbitmq.devservices.enabled=false
mp.messaging.outgoing.assistance-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.assistance-events.exchange.name=assistance.events
mp.messaging.outgoing.assistance-events.exchange.type=topic

rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USER:guest}
rabbitmq-password=${RABBITMQ_PASS:guest}

# =============================================================================
# OpenTelemetry
# =============================================================================
quarkus.otel.enabled=${OTEL_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=smms-assistance-service

# =============================================================================
# Logging
# =============================================================================
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO

# Temporal: permitir todo
quarkus.http.auth.permission.permit1.paths=/*
quarkus.http.auth.permission.permit1.policy=permit